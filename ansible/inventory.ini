# Список машин. IP-адреса взять из вывода: terraform output vm_ips
# Группа proxy — машина с прокси (порт 3000), группа web — машины с Nginx и страницей.

[proxy]
vm1 ansible_host=<IP_VM1>

[web]
vm2 ansible_host=<IP_VM2>
vm3 ansible_host=<IP_VM3>

[all:vars]
# Пользователь на ВМ и закрытый ключ, парный к ключу, сохранённому в кабинете
ansible_user=ubuntu
ansible_ssh_private_key_file=/home/user/.ssh/New_key31.10
# Автоматически принимать новый ключ сервера при первом подключении (для учебного стенда)
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
